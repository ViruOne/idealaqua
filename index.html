<script>
    const BOT_TOKEN = "8667051988:AAEcPNAYG2rEDp6IKyomGkVxE2Wmr8jeuok";[cite: 3]
    const CHAT_ID = "7782825299";[cite: 3]

    let allProducts = [];[cite: 3]
    let cart = [];[cite: 3]
    let currentCategory = 'all';[cite: 3]

    async function loadProducts() {[cite: 3]
        try {
            const t = new Date().getTime();[cite: 3]
            let loadedItems = [];[cite: 3]

            const indexRes = await fetch(`/data/products.json?v=${t}`);[cite: 3]
            
            if (indexRes.ok) {[cite: 3]
                const contentType = indexRes.headers.get("content-type");[cite: 3]
                if (contentType && contentType.includes("application/json")) {[cite: 3]
                    const fileList = await indexRes.json();[cite: 3]
                    
                    if (Array.isArray(fileList)) {[cite: 3]
                        const fetchPromises = fileList.map(async (fileName) => {[cite: 3]
                            try {
                                const pRes = await fetch(`/data/products/${fileName}?v=${t}`);[cite: 3]
                                if (pRes.ok) return await pRes.json();[cite: 3]
                            } catch (err) {
                                return null;[cite: 3]
                            }
                        });

                        const fetched = await Promise.all(fetchPromises);[cite: 3]
                        loadedItems = fetched.filter(p => p && typeof p === 'object');[cite: 3]
                    }
                }
            }

            allProducts = loadedItems.map((p, index) => ({[cite: 3]
                id: p.id || `prod_${index}`,[cite: 3]
                title: p.title || p.name || p.nomi || "Nomsiz mahsulot",[cite: 3]
                category: p.category || p.kategoriya || "Barchasi",[cite: 3]
                price: Number(p.price || p.narxi) || 0,[cite: 3]
                image: p.image || "",[cite: 3]
                body: p.body || p.description || p.tavsif || ""[cite: 3]
            }));

            renderCategories();[cite: 3]
            filterProducts();[cite: 3]

        } catch (e) {
            console.error("Yuklash xatosi:", e);[cite: 3]
            renderCategories();[cite: 3]
            renderEmpty("Mahsulotlarni yuklashda xatolik yuz berdi.");[cite: 3]
        }
    }

    function syncMobileSearch(val) {[cite: 3]
        const desktopInput = document.getElementById('search-input');[cite: 3]
        if (desktopInput) {[cite: 3]
            desktopInput.value = val;[cite: 3]
            filterProducts();[cite: 3]
        }
    }

    function focusMobileSearch() {[cite: 3]
        const mobileInput = document.getElementById('search-input-mobile');[cite: 3]
        if (mobileInput) {[cite: 3]
            mobileInput.focus();[cite: 3]
            window.scrollTo({ top: 0, behavior: 'smooth' });[cite: 3]
        }
    }

    function renderCategories() {[cite: 3]
        const catNav = document.getElementById('categories-list');[cite: 3]
        const catMobileNav = document.getElementById('categories-mobile-list');

        const counts = {};[cite: 3]
        allProducts.forEach(p => {[cite: 3]
            let cat = p.category || 'Boshqa';[cite: 3]
            if (typeof cat === 'string') cat = cat.trim();[cite: 3]
            if (!cat) cat = 'Boshqa';[cite: 3]
            counts[cat] = (counts[cat] || 0) + 1;[cite: 3]
        });

        // DESKTOP NAVIGATION
        if (catNav) {
            let html = `
                <button onclick="selectCategory('all')" 
                        class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-left ${currentCategory === 'all' ? 'bg-aqua-500/10 text-aqua-400 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-900'}">
                    <span><i class="fas fa-border-all mr-2 opacity-70"></i> Barchasi</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-slate-400">${allProducts.length}</span>
                </button>
            `;[cite: 3]

            Object.keys(counts).forEach(cat => {[cite: 3]
                const isActive = currentCategory === cat;[cite: 3]
                const activeClasses = isActive ? 'bg-aqua-500/10 text-aqua-400 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-900';[cite: 3]
                const safeCat = cat.replace(/'/g, "\\'");[cite: 3]
                html += `
                    <button onclick="selectCategory('${safeCat}')" 
                            class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-left ${activeClasses}">
                        <span class="truncate"><i class="fas fa-folder mr-2 opacity-70"></i> ${cat}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-slate-400">${counts[cat]}</span>
                    </button>
                `;[cite: 3]
            });
            catNav.innerHTML = html;[cite: 3]
        }

        // MOBILE GORIZONTAL NAVIGATION
        if (catMobileNav) {
            let mHtml = `
                <button onclick="selectCategory('all')" 
                        class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5 ${currentCategory === 'all' ? 'bg-aqua-500 text-slate-950 font-bold' : 'bg-slate-950 border border-slate-800 text-slate-300'}">
                    Barchasi (${allProducts.length})
                </button>
            `;

            Object.keys(counts).forEach(cat => {
                const isActive = currentCategory === cat;
                const safeCat = cat.replace(/'/g, "\\'");
                const btnClass = isActive ? 'bg-aqua-500 text-slate-950 font-bold' : 'bg-slate-950 border border-slate-800 text-slate-300';
                mHtml += `
                    <button onclick="selectCategory('${safeCat}')" 
                            class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition flex items-center gap-1.5 ${btnClass}">
                        ${cat} (${counts[cat]})
                    </button>
                `;
            });
            catMobileNav.innerHTML = mHtml;
        }
    }

    function selectCategory(cat) {[cite: 3]
        currentCategory = cat;[cite: 3]
        renderCategories();[cite: 3]
        filterProducts();[cite: 3]
    }

    function filterProducts() {[cite: 3]
        const desktopInput = document.getElementById('search-input');[cite: 3]
        const mobileInput = document.getElementById('search-input-mobile');
        
        let q = '';
        if (desktopInput && desktopInput.value) {
            q = desktopInput.value.toLowerCase().trim();
        } else if (mobileInput && mobileInput.value) {
            q = mobileInput.value.toLowerCase().trim();
        }

        const filtered = allProducts.filter(p => {[cite: 3]
            const pCategory = (p.category || 'Boshqa').trim();[cite: 3]
            const pTitle = p.title || '';[cite: 3]
            const pBody = p.body || '';[cite: 3]

            const matchCategory = (currentCategory === 'all') || (pCategory === currentCategory);[cite: 3]
            const matchSearch = pTitle.toLowerCase().includes(q) || pBody.toLowerCase().includes(q);[cite: 3]
            
            return matchCategory && matchSearch;[cite: 3]
        });

        renderProducts(filtered);[cite: 3]
    }

    function renderProducts(products) {[cite: 3]
        const grid = document.getElementById('products-grid');[cite: 3]
        if (!grid) return;[cite: 3]

        if (!products || products.length === 0) {[cite: 3]
            return renderEmpty("Ushbu kategoriyada mahsulotlar topilmadi.");[cite: 3]
        }

        grid.innerHTML = '';[cite: 3]
        products.forEach((p) => {[cite: 3]
            const title = p.title || 'Nomsiz Mahsulot';[cite: 3]
            const body = p.body || '';[cite: 3]
            const price = Number(p.price) || 0;[cite: 3]
            const category = p.category || 'Boshqa';[cite: 3]
            const realIndex = allProducts.findIndex(item => item.title === title);[cite: 3]

            const img = p.image[cite: 3]
                ? `<img src="${p.image}" class="h-40 sm:h-48 w-full object-cover group-hover:scale-105 transition duration-500" alt="${title}">`[cite: 3]
                : `<div class="h-40 sm:h-48 w-full bg-slate-900 flex items-center justify-center text-slate-700 group-hover:text-aqua-500 transition duration-300"><i class="fas fa-box text-4xl sm:text-5xl"></i></div>`;[cite: 3]

            grid.innerHTML += `
                <div class="bg-slate-950 border border-slate-800/80 hover:border-aqua-500/40 rounded-2xl flex flex-col justify-between overflow-hidden transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-aqua-500/5 group">
                    <div class="relative">
                        <div class="overflow-hidden bg-slate-900">
                            ${img}
                        </div>
                        <div class="absolute top-2.5 left-2.5 flex flex-col gap-1 z-10">
                            <span class="bg-slate-900/80 border border-slate-700 text-aqua-400 text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-md">
                                ${category}
                            </span>
                        </div>
                    </div>

                    <div class="p-3.5 sm:p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h4 class="font-bold text-slate-100 group-hover:text-aqua-400 transition-colors duration-200 text-xs sm:text-sm line-clamp-2 leading-snug">
                                ${title}
                            </h4>
                            <p class="text-[11px] sm:text-xs text-slate-400 line-clamp-2 mt-1 font-normal leading-relaxed">
                                ${body || 'Ushbu mahsulot uchun tavsif kiritilmagan.'}
                            </p>
                        </div>

                        <div class="flex items-center justify-between border-t border-slate-900/80 pt-2.5 mt-auto">
                            <div class="flex flex-col">
                                <span class="text-[9px] sm:text-[10px] text-slate-500 font-semibold uppercase tracking-wider">Narxi</span>
                                <span class="font-extrabold text-aqua-400 text-sm sm:text-base tracking-tight">
                                    ${price.toLocaleString()} <span class="text-[10px] sm:text-xs font-normal text-slate-400">so'm</span>
                                </span>
                            </div>
                            <button onclick="addToCart(${realIndex >= 0 ? realIndex : 0})" 
                                    title="Savatga qo'shish"
                                    class="bg-slate-900 hover:bg-aqua-500 hover:text-slate-950 border border-slate-800 hover:border-aqua-400 text-slate-200 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-xs font-bold transition duration-200 flex items-center gap-1.5 group/btn active:scale-95">
                                <i class="fas fa-cart-plus text-xs sm:text-sm group-hover/btn:scale-110 transition"></i>
                                <span>Qo'shish</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;[cite: 3]
        });
    }

    function renderEmpty(msg) {[cite: 3]
        const grid = document.getElementById('products-grid');[cite: 3]
        if (grid) {[cite: 3]
            grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">${msg}</div>`;[cite: 3]
        }
    }

    function addToCart(index) {[cite: 3]
        const product = allProducts[index];[cite: 3]
        if (!product) return;[cite: 3]

        const title = product.title || 'Nomsiz';[cite: 3]
        const price = Number(product.price) || 0;[cite: 3]

        const existing = cart.find(c => c.title === title);[cite: 3]
        if (existing) {[cite: 3]
            existing.qty++;[cite: 3]
        } else {
            cart.push({ title, price, qty: 1 });[cite: 3]
        }
        updateCartUI();[cite: 3]
        toggleCart(true);[cite: 3]
    }

    function updateCartUI() {[cite: 3]
        const badge = document.getElementById('cart-badge');[cite: 3]
        const badgeMobile = document.getElementById('cart-badge-mobile');[cite: 3]
        const totalElem = document.getElementById('cart-total');[cite: 3]
        const list = document.getElementById('cart-items');[cite: 3]

        const totalQty = cart.reduce((s, i) => s + i.qty, 0);[cite: 3]
        const totalPrice = cart.reduce((s, i) => s + (i.price * i.qty), 0);[cite: 3]

        if (badge) badge.textContent = totalQty;[cite: 3]
        if (badgeMobile) badgeMobile.textContent = totalQty;[cite: 3]
        if (totalElem) totalElem.textContent = `${totalPrice.toLocaleString()} so'm`;[cite: 3]

        if (list) {[cite: 3]
            if (cart.length === 0) {[cite: 3]
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Savatcha bo'sh</p>`;[cite: 3]
            } else {
                list.innerHTML = cart.map((item, idx) => `
                    <div class="flex justify-between items-center p-3 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                        <div>
                            <p class="font-bold text-white">${item.title}</p>
                            <p class="text-slate-500">${item.price.toLocaleString()} so'm</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${idx}, -1)" class="text-slate-400 hover:text-white px-2 py-0.5 bg-slate-800 rounded">-</button>
                            <span class="font-bold">${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" class="text-slate-400 hover:text-white px-2 py-0.5 bg-slate-800 rounded">+</button>
                        </div>
                    </div>
                `).join('');[cite: 3]
            }
        }
    }

    function changeQty(idx, delta) {[cite: 3]
        if (!cart[idx]) return;[cite: 3]
        cart[idx].qty += delta;[cite: 3]
        if (cart[idx].qty <= 0) cart.splice(idx, 1);[cite: 3]
        updateCartUI();[cite: 3]
    }

    function toggleCart(open) {[cite: 3]
        const drawer = document.getElementById('cart-drawer');[cite: 3]
        const panel = document.getElementById('cart-panel');[cite: 3]
        if (!drawer || !panel) return;[cite: 3]

        if (open) {[cite: 3]
            drawer.classList.remove('pointer-events-none', 'opacity-0');[cite: 3]
            panel.classList.remove('translate-x-full');[cite: 3]
        } else {

    async function checkout() {[cite: 3]
        const nameElem = document.getElementById('cust-name');[cite: 3]
        const phoneElem = document.getElementById('cust-phone');[cite: 3]
        const btn = document.getElementById('checkout-btn');[cite: 3]

        const name = nameElem ? nameElem.value.trim() : '';[cite: 3]
        const phone = phoneElem ? phoneElem.value.trim() : '';[cite: 3]

        if (!name || !phone) {[cite: 3]
            alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");[cite: 3]
            return;[cite: 3]
        }

        if (cart.length === 0) {[cite: 3]
            alert("Savatchangiz bo'sh!");[cite: 3]
            return;[cite: 3]
        }

        btn.disabled = true;[cite: 3]
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Yuborilmoqda...`;[cite: 3]

        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);[cite: 3]
        let message = `🛒 *YANGI BUYURTMA (IDEAL AQUA)*\n\n`;[cite: 3]
        message += `👤 *Mijoz:* ${name}\n`;[cite: 3]
        message += `📞 *Tel:* ${phone}\n\n`;[cite: 3]
        message += `📦 *Mahsulotlar:* \n`;[cite: 3]

        cart.forEach((item, index) => {[cite: 3]
            message += `${index + 1}. ${item.title} — ${item.qty} ta x ${item.price.toLocaleString()} = ${(item.price * item.qty).toLocaleString()} so'm\n`;[cite: 3]
        });

        message += `\n💰 *Jami:* ${total.toLocaleString()} so'm`;[cite: 3]

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {[cite: 3]
                method: 'POST',[cite: 3]
                headers: { 'Content-Type': 'application/json' },[cite: 3]
                body: JSON.stringify({[cite: 3]
                    chat_id: CHAT_ID,[cite: 3]
                    text: message,[cite: 3]
                    parse_mode: 'Markdown'[cite: 3]
                })
            });

            if (response.ok) {[cite: 3]
                cart = [];[cite: 3]
                updateCartUI();[cite: 3]
                if (nameElem) nameElem.value = '';[cite: 3]
                if (phoneElem) phoneElem.value = '';[cite: 3]
                
                toggleCart(false);[cite: 3]
                document.getElementById('success-modal').classList.remove('hidden');[cite: 3]
            } else {
                alert("Telegram API'da xatolik yuz berdi.");[cite: 3]
            }
        } catch (err) {
            alert("Tarmoq xatosi!");[cite: 3]
        } finally {
            btn.disabled = false;[cite: 3]
            btn.innerHTML = `<i class="fas fa-check-circle"></i> Buyurtmani Tasdiqlash`;[cite: 3]
        }
    }

    function closeSuccessModal() {[cite: 3]
        const modal = document.getElementById('success-modal');[cite: 3]
        if (modal) modal.classList.add('hidden');[cite: 3]
    }

    document.addEventListener('DOMContentLoaded', loadProducts);[cite: 3]
</script>
